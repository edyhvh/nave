technical_philosophy:
  trend:
    components:
      - magnitude: Candles - Measure trend strength via candle size.
      - velocity: Time - Speed of price movement.
      - cadence: Pullback - Frequency and depth of corrections.
    code_orientation: Implement as a function to classify trend (e.g., calculate average candle body, time between highs/lows, Fibonacci retracements for cadence).

  momentum:
    levels:
      - high: High momentum - Strong directional moves.
      - medium: Medium momentum - Balanced trends.
      - low: Low momentum - Weak or ranging markets.
    volatility_interaction:
      - Models do not fulfill perfectly; dance between momentum and volatility.
      - Fundamental needed for momentum; post-momentum volatility leads to counter-moves for setups.
      - 80% breakouts fail in volatility; changes between models are non-violent.
    code_orientation: Develop momentum indicator (e.g., using RSI or rate of change); integrate volatility check (ATR) to detect shifts and generate setup alerts.

  volatility:
    definition: percentage of asset decision with respect to its average price over a determined period.
    code_orientation: Calculate as standard deviation or ATR; use for filtering trades (e.g., avoid entries if volatility > threshold).

  supports_and_resistances:
    key_elements:
      - Peaks and valleys.
      - Order blocks.
      - Price swings.
      - Delimit in HTF; use order flow and volatility formation.
      - NAVE assumes positions in regressions.
      - Long-data swings important for S/R.
      - Market moves via orders; identify trapped orders and trend.
    new_theory:
      - Institutional levels: 00, 20, 50, 80.
      - Number of touches: Critical levels.
      - Implicit levels: Annual, monthly, weekly, daily opens/closes.
      - Time importance; vertical lines for trend changes.
      - S/R should match institutional levels.
      - Wait candle-by-candle for peak/valley formation.
    code_orientation: Algorithm to detect swings (e.g., ZigZag indicator); mark institutional levels; backtest touches for criticality.

  psychology:
    principles:
      - Commercials move the market.
      - Speculate is making a bet.
      - We are takers.
      - Commercials/institutions are makers.
      - Commercials/institutions do not watch indicators.
      - Watch time.
      - Watch momentum.
      - There is a 50%-50%.
      - Lesser market exposure = Lesser risk exposure.
      - Each market is different.
      - Some assets are more technical than others.
      - FED and central banks seek to generate necessary confidence.
      - Money Market. The market prices money.
      - Being profitable consists in:
      - Asymmetric risks.
      - Know how to reduce losses and increase gains.
      - The market is an efficient site to generate transactions.
      - Why does it move from one point to another? By the quantity of orders.
      - When stop orders overpower limits, there is continuation of the impulse.
      - When limit orders overpower stops, there is regression of the impulse.
      - The market is not the chart.
      - Regression points are formed by orders at those levels.
      - Equilibrium. Optimal movement for arbitrage.
      - Imbalance. Optimal movement for leverage.
      - Exchange desks. Aggregator, monitor and try to offer the best price. Dealers-Interdealers.
      - An efficient market consists of sufficient liquidity in consolidative processes and releases them in impulsive processes.
      - Liquidity. Capacity that a market place has to absorb orders (matching) of offerers and demanders through risk third-party and charge of the service (offset risk-liquidity engine) or assuming the risk within their own balance sheets.
      - Not the same: price, chart, market.
      - Risk-on: Risk opening.
      - Risk-off: Risk aversion.
      - No one trades the market but their belief of the market.
      - Sell-side: Market making.
      - Buy-side: All others.
      - Market making. Create market, necessary liquidity. Matching process, matching trading. Pair positions, buyers and sellers.
      - Power axes
      - 1. USA
      - 2. EU (European Union)
      - 3. China.
      - A trader is paid for the quantity of uncertainty they are willing to assume.
      - Derivatives are also useful for price ranges.
      - Know how to locate blocks.
      - We position pre-momentum because there is the greatest amount of money.
      - Do not be egocentric, trading is discretionary.
      - The market is a perfectly arbitrated site when it is not, desbalances occur.
      - The Market is a dynamic process and cannot be static in a system of constant dynamism.
      - There is an important difference between Difference between price, value, cost.
      - The existence of fundamental value (in the chaos of technical analysis) does not exist such thing as "technical value".
      - Time is primordial for speculators and, inclusive, can be their best friend if used correctly.
    code_orientation: Incorporate in risk models (e.g., position sizing based on risk-on/off detection via VIX); simulate psychology via backtests.

  risk_management:
    steps:
      - Position size. Q
      - What is the Stop Loss in pips.
      - How many pips we are winning or losing.
      - Risk per operation.
    guidelines:
      - Evolution of the R.
      - Have a good R:R.
      - Take profits before objective if necessary.
      - Do not seek entries but probabilities.
      - Establish budget.
      - No need to take all operations.
      - Establish an income and operate around it.
      - Reduce risk if you are slapped by the market.
      - Define a weekly risk according to capital.
      - Define which setups are the best.
    stop_loss:
      - SL according to TA and not percentages.
      - Calculate the SL where it is known it will not be touched.
      - SL in invalidation points, points where the setup is invalidated by price. Where the idea is not true.
      - Avoid putting stops in obvious liquidity pools.
      - Monitor price action.
      - Retailers are more foolish and obvious than we see or believe.
      - They are unique depending on the setup.
    code_orientation: Build risk calculator module; functions for SL placement (e.g., beyond swings); backtest R:R ratios.

  strategy:
    core:
      - We are in favor of the trend.
      - We seek regressions in favor of the trend.
      - We use breaks.
      - Observe if the market is starting or ending a trend.
      - Time we are going to dedicate.
      - Establish what I like to see in the chart.
      - Wait candle by candle for the peak and valley to form.
      - Be aware of the daily openings of the pairs to observe.
      - Define magnitude: High, Medium, Low.
      - Bullish or Bearish.
      - Seek MHM in LTF.
      - Watch loss of Momentum.
      - Similarity not exactitude.
      - Watch systematically the fundamentals.
    process:
      - Trend.
      - Directionality.
      - Pattern.
      - Order Flow.
      - If TM bullish, tm bullish.
      - If TM bearish, tm bearish.
    price_structure:
      - Serves for:
      - Define risks. Asymmetric risks.
      - Create projections. Confluence zones.
      - Use directionality. Situational analysis.
      - The premise gives me the structure - EXTERNAL INFO.
      - The premise gives me directionality.
      - Evaluate market data with respect to the trend.
      - Define if there is risk-on or risk-off.
    before_taking_any_position:
      - When am I going to exit?
      - What is the lot size to assume?
      - Projections of the movement.
      - a) Probability.
      - b) What happens in the macro?
    approach:
      - Premise.
      - Establish trend. Market Makers' Buy Movement - Market Makers' Sell Movement.
      - Define graphic structure. Macro Trend
      - Define phase. IPDA.
    retailers:
      - What levels are they watching?
      - Their orders?
      - Toward where would be the liquidity necessary for IPDA to liquidate 86% of the movement?
    sifi_banks:
      - Toward where are they aiming?
      - Which have the competitive advantage?
      - What are they doing at level of?:
      - Interest rates.
      - Trades.
      - Clients.
      - Price.
      - Cost.
      - Business.
      - Investment.
    logistics_and_architecture:
      logistics:
        description: Everything needed to arm a position.
        exit_points:
          - Exit points.
          - a) TP: Possible Confluence Zone, SZC.
          - b) SL: Invalidation points.
        entry_points:
          - Entry points. Entry reason.
          - Continuation or regression.
          - Pullback or impulse.
        assumed_risk:
          - Assumed risk.
      architecture:
        description: Reasons to watch the asset in question and locate the logistics elements in the chart.
        elements:
          - Macro and fundamental reading.
          - 1. Fundamental reason.
          - 2. Forecast of the asset value.
      notes:
        description: All systems are based on leveraging positions in pullbacks. Post-volatility pre-momentum. We must wait for directionality.
        points:
          - While farther you place the order from the breakout point.
          - a) Higher probability of being taken.
          - b) Higher amount of assumed risk.
          - c) Higher space for price to oscillate,
          - While closer you place the order from the breakout point.
          - a) Lower possibility of being taken.
          - b) Lower amount of assumed risk.
          - c) Lower space for price to oscillate.
      timeframes:
        description: Macro Trend - Price phase in which we are (IPDA)
        elements:
          - Tm - Imbalances.
          - Tm - Entry patterns.
    code_orientation: Strategy engine with functions for trend detection (Market Makers' Buy Movement/Market Makers' Sell Movement), phase classification (IPDA), entry/exit signals based on regressions.

  ranges:
    pfqs:
      - Toward where is the pressure?
      - For ranges:
      - Apply regression patterns.
      - Wait False Breakout Patterns.
      - Go in favor of the trend.
      - Wide stops.
      - Position reduction.
      - Risk reduction.
      - If there is break, wait round retracement.
      - When we are in a range can occur 2 scenarios after a break, continuation, breaks the level, retraces to then continue expanding or abdication, respect of the level, can even close above the level but retraces to the range violently.
      - False Breakout Patterns - Stop Loss Hunt are risks by abdication.
    price_excess: Levels of absolute regression after collecting liquidity in a point of order accumulation. Liquidity shutdown.
    abdication_risk:
      description: Strong regression to range; focus on trapped traders, use opposite side advantage, assume equal/greater risk.
      points:
        - When there is a break we could have:
        - 1. Abdication risk.
        - 2. Certain breakout movement.
        - Strong candle against the break.
        - Abdication risk.
        - When there is a break one must ask What changed?
        - It is a liquidity trap.
        - Is there a fundamental reason that explains the movement?
    concepts:
      - Cash Flow: Search for the greatest amount of money in a retracement to then regress with the trend.
      - Order Flow: Movements that are generated in IPDA phase to perform the Cash Flow.
    code_orientation: Range detector (e.g., Bollinger Bands); False Breakout Patterns breakout scanner; abdication risk calculator.

  stock_market_dance:
    framework:
      - Expansion.
      - Retracement.
      - Regression.
      - Consolidation.
    institutional_reference_points:
      - Price blocks.
      - Imbalances.
      - Liquidity pools and Stop Loss Hunt.
      - Equilibrium.
    market_movement:
      description: By liquidity. How fast the market can absorb certain quantity of orders at certain point.
      elements:
        - Speed.
        - Trade.
        - Volume.
        - Pending orders.
    phases:
      - Consolidation: Volatility, order matching.
      - Expansion: Order blocks.
      - Retracement: Re-pricing. Manifests in form of imbalances. Fair value.
      - Regression: Movement in opposite sense.
    code_orientation: State machine for phase detection; liquidity absorption models.

  imbalances:
    elements:
      - Pre-imbalance candle.
      - Post-imbalance candle.
    liquidity_locations:
      - Swings.
      - Price blocks.
      - Rejection blocks.
      - Order blocks.
      - Liquidity blocks.
      - Suspension blocks.
      - Mitigation blocks.
      - Annual/monthly/weekly opens.
      - Historical supports.
      - Institutional levels.
    liquidity_pool:
      - Below swing lows or above swing highs.
      - Above high ranges.
      - Below low ranges.
      - Important swings.
      - HTF highs and lows.
      - Equal swings.
    identification:
      - Where are the retail stops? Stop Loss Hunt is when price goes toward an area where retail stops are.
    blocks_of_price:
      - Blocks are supports and resistances. They are zones or areas where we expect a rebound. Price zones.
      - Rejection block. Normally found in liquidity search processes like False Breakout Patterns and Stop Loss Hunt.
      - Order blocks. Points where there was sponsorship of an institutional movement.
      - Impulse blocks. They are reaction movements that confirm the structure break.
      - Suspension blocks. Presume that the last SH made in a Market Makers' Buy Movement or the last SL made by a Market Makers' Sell Movement, is, in effect, the last of that profile. These hunt bottoms or tops.
      - Mitigation blocks. The categorization of block of the candles give those candles that go against the current movement.
      - Bullish, bearish candles.
      - Bearish, bullish candles.
    mitigation_blocks: Why mitigation blocks? Because we are seeking the last point of optimal/efficient commercialization in the market. That happens in regression movements, price goes toward those levels by order flow.
    projections:
      description: Fair Value Gap and confluence zones serve to make projections.
    fair_value_gaps:
      description: Imbalances or excesses in price due to market inefficiencies to arbitrage them. Price will tend to return to fill that gap.
    confluence_zones:
      description: Demarcate areas that can present rejection by price. Also points where there can be lateralization.
      elements:
        - In bullish. Supports during the prior Market Makers' Sell Movement.
        - In bearish. Resistances during the prior Market Makers' Buy Movement.
    code_orientation: Block classifier; overlay on charts.

  process_oriented_system_sop:
    steps:
      - Define the level in Macro: Bullish or Bearish.
      - Define trend in Macro Trend.
      - Define structure. IPDA phase.
      - Propitious liquidity for discount.
      - Propitious liquidity for discount.
      - 3.1 Liquidity generation points.
      - 3.2 Order matching.
      - While price goes in its trend, mark liquidity generation points.
      - Optimal discount levels.
      - Anticipate regression to those levels to seek setups.
      - Point to which the pullback can extend.
      - The liquidity that resides there is to seek positions.
    pre_launch_order_questions:
      - Is there or not momentum in the trend?
      - Is there trend change or are we in a Pullback of a major movement?
      - What orders is price triggering currently? Stop orders or limit orders.
    code_orientation: SOP workflow in code; pre-trade checklist functions.

  fundamentals:
    analysis: The fundamental analysis depends on the subject and probability, 'When you hear something barking think first of a dog' is to go for the most intuitive.
    currencies:
      - Currencies are divided in 2 groups.
      - To know the value of a currency in the long term we can use: Purchasing Power Parity and Net International Investment Position. In the short term we focus on capital flows.
      - 1. Center and periphery.
      - Their variables are:
      - 1. Growth.
      - 2. Monetary policy.
      - 3. Risk appetite.
      - 2. Commodities and free float.
    code_orientation: Fundamental scorer integrating APIs.

  setups:
    inverted_level_ni_or_ni_plus_50_percent:
      - Breakout.
      - Round retracement
      - Swing high or Swing low.
      - Place order.
      - They can occur via expansion, consolidation, retracement or expansion, retracement.
    false_break_pattern_pfq:
      - Peaks and valleys (explicit and implicit).
      - Stop Loss Hunt in previous swings.
      - Regression. (Consolidation or rejection).
      - Evaluate R:R.
      - 1. Establish levels and see previous swings.
      - 2. The swing has to form.
      - 3. High volume.
      - 4. Order.
    pullback:
      - Defined trend.
      - Defined structure.
      - Clear levels.
      - A MHM
      - Wait strong movement. Direction.
      - Wait for an entry when price retraces to a price defined in advance.
      - Immediate pullbacks are better in tm.
      - When it breaks a support or resistance we place a limit order immediately at the support or resistance to wait the retracement.
      - In pullbacks we bet on liquidity shutdowns.
    momentum_imbalance:
      - Imbalance.
      - Equilibrium.
      - Entry.
      - Profit.
    swing_failure_pattern:
      - Swing in your directional TF.
      - Break of that swing with False Breakout Patterns.
      - Structure break. (Confirm Market Makers' Buy Movement or Market Makers' Sell Movement).
      - Retracement to volatility zone and filling of imbalance up to 75%.
    optimal_discount_point:
      - 50% of the block.
      - Point within which it should present rejection.
      - Can be crossed by a wick but not above.
      - If it closes above it can seek higher levels.
    code_orientation: Setup detectors; backtest each for probability/R:R.
  fits_framework:
    description: >
      F.I.T.S. - Fundamental, Intramercado (Intermarket), Técnico, Sentimiento.
      The overarching analytical lens of the Nave methodology. All four must be evaluated
      before taking any position. The premise (direction/narrative) is built from the outside in.
    components:
      fundamental:
        description: >
          Macroeconomic and microeconomic reading of the asset. Determines the directional bias
          for currencies, crypto, equities. Uses variables like growth, monetary policy, and
          risk appetite for center/periphery currencies; PPP and NIIP for long-term currency value;
          capital flows for short-term.
        key_questions:
          - What is the fundamental reason to be in this asset?
          - What is the forecast of the asset value?
          - Is the current price above or below fundamental value?
      intermarket:
        description: >
          Cross-market analysis. How correlated assets (bonds, equities, commodities, DXY)
          interact and give directional context. The IPDA algorithm operates within this layer.
        key_elements:
          - Bond yields vs equity flows.
          - DXY correlation with commodities and crypto.
          - Power axes: USA, EU, China.
      technical:
        description: >
          Price structure, phases (IPDA), setups, entry and exit mechanics.
          Technical analysis serves as the execution layer, not the directional layer.
          A chart is only a representation of reality, not reality itself.
        notes:
          - The chart is a reflection of the fears, ambitions, and panic of market participants.
          - Do not confuse price with value or cost.
      sentiment:
        description: >
          Market psychology and positioning. AAII surveys, VIX, risk-on/risk-off gauges.
          Sentiment provides the filter: confirm that the crowd is wrong before positioning against them.
        key_elements:
          - Contrarian use of AAII (spike in bulls may indicate continuation).
          - VIX for risk appetite gauge.
          - Fear and greed indices for crypto.
          - "COT (Commitment of Traders): weekly reference (not driver). Tracks commercials (defensive hedgers who liquidate at USD and move against the trend at extremes) vs non-commercials (trend-following speculators). Commercials PROVIDE liquidity, they do NOT drive direction. See cot_integration.yaml for the full usage contract and weekly_decision_order precedence."

  institutional_narrative:
    description: >
      Understanding how institutions operate is foundational to the Nave methodology.
      This is not about blaming institutions for market moves, but understanding their
      structural constraints and how they create the liquidity we exploit.
    who_moves_the_market:
      - Investment banks and hedge funds.
      - Central banks of different countries.
      - Private speculators with enough capital to move markets.
      - Corporations and large institutional investors.
    institutional_characteristics:
      - Institutions abhor risk and use hedging on all positions (long spot + short futures, etc.).
      - They operate with "bigger pockets" — their position sizes dwarf retail traders.
      - They focus on price vs. value vs. cost distinctions.
      - They do not watch technical indicators; they watch time and order flow.
      - They use portfolio diversification and correlation-based risk management.
      - They can go long spot and short futures simultaneously for arbitrage/coverage.
    retail_vs_institutional:
      - Retail traders bet on direction without coverage.
      - Options without coverage (naked options) are highly risky for retail.
      - Institutions operate multi-market hedging that retail cannot replicate.
      - The casino analogy: same win rate but institutional nominal gains dwarf retail gains.
    how_institutions_analyze:
      - They distinguish between price (what you pay), value (what you receive), and cost.
      - They use the IPDA algorithm to deliver price efficiently.
      - They position for order matching, not chart patterns.
      - Time is their primary tool; price is secondary.
    interbank_trading_vs_order_flow:
      interbank_trading:
        description: >
          Cash flow. Responds to the four IPDA phases (expansion, consolidation, retracement, regression).
          Interbank algorithms deliver price through these phases to generate and absorb liquidity.
        alias: Cash Flow
      institutional_order_flow:
        description: >
          The moment when institutional money enters the market. Two types:
          1. Liquidity generation points.
          2. Order matching (emparejamiento de órdenes).
          This is about TIMING — when does the money enter?
        alias: Order Flow
        key_insight: >
          Order flow is the moment of institutional entry. Cash flow (interbank trading) is
          the delivery mechanism. Identify order flow first, then use cash flow to time entry.

  price_as_stochastic_system:
    description: >
      Price behaves as a stochastic system — directional but not precisely predictable.
      Like an ant trail: you can see the direction and pattern, but not the exact endpoint.
    implications:
      - Seek similarities, not exactitude.
      - We are placing bets, not making predictions.
      - The left side of the chart is readable; the right side is a probability distribution.
      - All trading systems are betting systems — maximize high-probability setups.
    fractal_nature:
      - Price patterns repeat across timeframes (fractals).
      - The same setup logic applies from LTF to HTF with structural context.
      - HTF confluence increases the probability of LTF setups succeeding.

  volatility_deep_dive:
    academic_basis: >
      Concepts derived from the Bank for International Settlements (BIS) report:
      "Financial Market Volatility: Measurement, Causes and Consequences" (1996).
      Trading is the final effect of many causes. We bet on the next consequence.
    market_phases_expanded:
      consolidation:
        type: Volatility phase.
        description: Points of equilibrium. Order matching. The market pairs buyers and sellers.
      expansion:
        type: Momentum phase.
        description: >
          Points of abduction — price moves away from its equilibrium point.
          Abduction (from anatomy): moving a body part away from its midpoint.
          In finance: price disparity from equilibrium, creating momentum.
      retracement:
        type: Momentum phase.
        description: >
          Pullback within the trend. Generates imbalances (fair value gaps).
          Price "steps back" to continue the move. Creates Cash Flow opportunities.
      regression:
        type: Volatility phase.
        description: >
          Full counter-movement. Points of high liquidity. Where major position reversals occur.
          This is where volatility strategies are applied.
    strategies_by_phase:
      momentum_strategies: Apply during expansion and retracement phases.
      volatility_strategies: Apply during consolidation and regression phases.
    key_formula: >
      Volatility = Percentage of asset price decision relative to its average price over a determined period.
      Operationally: Standard deviation or ATR. Use to filter trades and size risk.

  new_sr_theory_expanded:
    description: >
      The New Theory of Supports and Resistances does not work with exact points but with
      CONFLUENCE ZONES — areas where multiple factors align to create high-probability rejection levels.
    zone_construction:
      step_1: Identify the true retracement point (swing high or swing low).
      step_2: Identify the nearest institutional price level (ends in 00, 20, 50, or 80).
      step_3: The zone between the true retracement and the institutional level is the PRICE BLOCK.
      step_4: Score the zone by counting confluence factors.
    confluence_factors:
      - Price block (imbalance zone between true swing and institutional level).
      - Demand or supply zone (order block at that level).
      - Daily/weekly/monthly open or close nearby.
      - Number of previous touches (more touches = more critical).
      - HTF swing high or swing low.
      - Fair value gap within the zone.
      - Vertical time lines (time-based S&R).
    critical_level_criteria:
      - Institutional price (ends in 00, 20, 50, 80).
      - At least 2-3 confluence factors present.
      - Prior reaction (rejection wicks, imbalance candles).
    important_note: >
      Price does not need to touch the zone exactly. It can reject before reaching it
      if the zone is dense with confluence. A rejection candle before touching the block
      is itself a signal (imbalance/desbalance candle).

  75_percent_retracement_entry:
    description: >
      The 75% retracement setup (Retroceso al 75%) is one of the highest-probability
      entry tactics in the Nave methodology. It is specifically designed to catch
      tops and bottoms within the context of a HIGHER TIMEFRAME trend.
    classification: Regression pattern / Volatility setup.
    context_required: >
      Must be applied within a clear HTF directional context.
      Catching a top or bottom is inherently risky; HTF trend confluence reduces that risk.
    steps:
      1: Identify a clear swing in your directional timeframe.
      2: Wait for the swing to break with a False Breakout Pattern (PFQ).
      3: Confirm structure break (confirms Market Makers' Buy or Sell Movement).
      4: Wait for retracement to the volatile zone (fills imbalance up to 75%).
      5: Enter at the 75% level with defined SL at invalidation.
    relationship_to_other_setups:
      - Similar to Swing Failure Pattern but with 75% retracement trigger.
      - Uses the same imbalance/Fair Value Gap mechanics as other regression setups.
      - Immediate pullbacks in LTF are preferred over extended retracements.
    risk_note: >
      This is a high-risk/high-reward setup. The wide stop required means strict position sizing.
      Only valid when HTF structure is clearly defined.

  trading_psychology_expanded:
    description: >
      Psychology is the deepest layer of trading competence. Without the right mental framework,
      even the best technical system fails. The chart is a tool, not the market itself.
    key_mental_models:
      uncertainty_as_foundation:
        description: >
          The market is an uncertain system. Accepting this is the first step.
          You cannot know the right side of the chart — you can only read the left side
          and bet on the most probable continuation.
      trading_as_betting_system:
        description: >
          All trading is a betting system. Maximize bet on highest-probability setups.
          Minimize exposure on uncertain setups. A good R:R overcomes a sub-50% win rate.
      chart_as_reflection:
        description: >
          The chart reflects the fears, ambitions, and panic of all market participants.
          It is NOT the market. The market is the underlying flow of orders and capital.
      narrative_over_signals:
        description: >
          You need a narrative (premise) that ties together fundamental, intermarket,
          technical, and sentiment analysis. Signals without narrative are noise.
      similarity_not_exactitude:
        description: >
          Price patterns rhyme, they do not repeat exactly.
          Trade the probable similarity, not the exact replica.
      process_orientation:
        description: >
          Focus on following the process (SOP) correctly, not on the outcome of any single trade.
          A correct process with a losing trade is better than a wrong process with a winning trade.
    common_mistakes_to_avoid:
      - Looking for predictions instead of probabilities.
      - Treating technical signals as certainties.
      - Ignoring the narrative/fundamental premise.
      - Overexposure (reducing exposure reduces risk and emotional pressure).
      - Seeking entries instead of setups with favorable probability.
      - Being egocentric — the market does not care about your analysis.

  mitigation_blocks_deep_dive:
    description: >
      Mitigation blocks are the last point of optimal/efficient commercialization in the market.
      They occur in regression movements — price returns to these levels via order flow.
    definition: >
      Candles that go AGAINST the current movement direction. In a bullish trend, bearish candles.
      In a bearish trend, bullish candles. These candles mark where institutional orders
      were placed and not yet filled.
    why_they_work: >
      Price seeks the last point of optimal efficiency for market commercialization.
      Institutions need to fill their orders at these levels, so price is "delivered" back
      to mitigate those unfilled orders.
    usage:
      - Locate mitigation blocks on HTF first.
      - Use them as high-probability entry zones for Cash Flow setups.
      - Combine with IPDA phase (retracement/regression) for confirmation.
      - The 75% retracement setup often uses mitigation blocks as entry zones.
    identification_criteria:
      - Last bearish candle before a strong bullish expansion (for bullish mitigation).
      - Last bullish candle before a strong bearish expansion (for bearish mitigation).
      - Must occur at or near an institutional price level for maximum confluence.

  # ==========================================================================
  # PHASE 1 ADDITIONS — derived from docs/elcriptopanavideos.md
  # ==========================================================================

  top_down_timeframe_execution:
    description: >
      Explicit multi-timeframe execution pipeline. Direction is decided on the HTF;
      execution is routed through 4H and 1H. A pattern valid on 4H is not
      automatically valid on 1H — each timeframe has its own job.
    pipeline:
      weekly:
        role: Macro bias and COT reference.
        inputs:
          - Rates (FED / BCE / BoJ policy direction).
          - Monetary mass (TGA, RRP, balance sheet).
          - COT extremes and zero-line crossings for BTC.
          - IPDA phase (consolidation / expansion / retracement / regression).
        output: long / short / neutral weekly bias.
        rule: >
          If rates direction and COT direction disagree, the resolution is
          neutral — we do not take trades against macro rates on that coin.
      daily:
        role: Trend confirmation and key level identification.
        inputs:
          - Swing structure (higher highs / lower lows on daily candles).
          - Institutional price levels (ending in 00, 20, 50, 80).
          - Daily/weekly/monthly open and close reference lines.
          - Block rejection test (monthly block rejected on daily).
        output: >
          confirmed / unconfirmed daily trend + marked key levels
          (supports, resistances, mitigation blocks).
        rule: >
          Daily must confirm the weekly bias. If daily structure contradicts
          the weekly bias, stand down for the week — wait for the daily to
          either flip or align.
      four_hour:
        role: Setup formation and entry zone identification.
        required_conditions:
          - Price has reached a valid 4H confluence zone (see confluence_zones).
          - A structural element (block rejection, BOS, PFQ fractálico, mitigation)
            formed within that zone in the direction of the daily bias.
          - Retracement has reached at least the 75% zone of the impulse, not the 50% alert.
          - The 4H candle shows the expected shape for the phase (see candle_shape_to_phase).
        output: >
          valid 4H setup with direction, entry zone (price range),
          invalidation level (opposite side of the confluence zone), and
          target (next primary or secondary confluence zone).
        notes:
          - 4H is where the SETUP is born, not where you trigger the order.
          - If no valid 4H setup is present, there is no 1H trigger to look for.
        counter_move_is_the_setup:
          rule: >
            After the daily bias is confirmed, a 4H move AGAINST the daily bias is
            the EXPECTED condition for a setup to form — it is the pullback, not
            an invalidation. The 4H leg that "looks wrong" is the one we are waiting
            for; the impulse leg in the direction of the daily bias has already
            happened and is not a fresh entry.
          rationale: >
            This resolves the single biggest source of rejected setups in the
            2017-bull+2018-bear backtest (53 of 94 daily-confirmed weeks): a
            naive "4H trend must match daily trend" check rejects every pullback
            and leaves only chase-entries into exhausted impulses. The refined
            theory is the opposite — we wait for the retracement, then enter
            when a 4H structural element (block rejection, PFQ fractálico,
            BOS against the pullback) prints inside a confluence zone.
          how_to_apply:
            - If daily bias is LONG and 4H is pulling back (lower lows on the
              4H), do NOT reject the week — mark it as a candidate for
              retroceso_75_setup, block_rejection_plus_bos, or pfq_fractalico.
            - If daily bias is LONG and 4H is extending in the long direction
              without a pullback, the week is in the impulse phase, not a setup.
              Stand aside and wait — this is also NOT an entry.
            - If daily bias is LONG and 4H has broken structure against the
              daily (BOS down on 4H by more than one swing), the daily bias
              itself is at risk. Demote to neutral and wait for daily to
              re-confirm. This is the only scenario where "4H opposes daily"
              is a true invalidation, not just a pullback.
            - Mirror all three rules for SHORT bias.
          invalidation_vs_pullback:
            pullback_criterion: >
              A counter-daily 4H move that stays inside the last confluence zone
              and does not break more than one prior 4H swing in the counter
              direction.
            invalidation_criterion: >
              A counter-daily 4H move that breaks two or more prior 4H swings
              in the counter direction AND closes beyond the last daily
              confluence level.
          note_for_engines: >
            Any backtest engine reading this section must not implement the 4H
            validity check as "4H trend MA matches daily trend MA". That
            heuristic rejects the very pullbacks that constitute the setup.
            Implement it instead as "4H is inside a confluence zone AND a
            structural element has printed" — direction-of-trend on the 4H
            itself is irrelevant once daily is confirmed.
      one_hour:
        role: Precise entry trigger and execution timing.
        required_conditions:
          - A valid 4H setup is active and its invalidation has not been touched.
          - A 1H entry pattern has printed inside the 4H entry zone (see entry_triggers_1h).
          - Liquidity has been taken (sweep of a 1H swing) before the trigger fires —
            this is the "stop hunt / PFQ" that precedes real institutional entries.
          - Broker spread is acceptable (otherwise, rprice risk eats the edge).
        output: >
          entry price, stop-loss price, take-profit levels (TP1 = first confluence zone,
          TP2 = second confluence zone), position size in R.
        notes:
          - 1H trigger without a 4H setup is noise, not signal. Skip it.
          - The trigger closes the loop — after this the trade is committed.

  entry_triggers_4h:
    description: >
      The 4H level is where a setup *forms*. These are the recognized 4H setup
      patterns; all of them require that the higher-timeframe bias is already
      established.
    patterns:
      block_rejection_plus_bos:
        trigger: >
          Price taps a monthly or weekly block on the 4H, rejects it with a
          strong wick/body, and breaks the last 4H swing in the direction of
          the bias.
        invalidation: 4H close beyond the tapped block's far edge.
      pfq_fractalico:
        trigger: >
          A 4H candle that sweeps a prior 4H swing (stop hunt / false
          breakout) and closes back inside the range. The sweep must
          coincide with an institutional level (00/20/50/80).
        invalidation: 4H close beyond the swept level.
      retroceso_75_setup:
        trigger: >
          After a confirmed 4H impulse in the direction of bias, wait for a
          retracement into the 75–86% zone of that impulse, landing in a
          confluence zone.
        invalidation: 4H close beyond the origin of the impulse (100%+).
      flip_plus_ben:
        trigger: >
          Prior 4H support becomes resistance (or vice versa) after a break,
          and the flip occurs within a BEN (block-between-levels) — the zone
          between the true swing and the nearest institutional level.
        invalidation: 4H close back through the flipped level.

  entry_triggers_1h:
    description: >
      1H is the execution layer. These triggers fire only when a valid 4H
      setup is already active and price has entered the 4H entry zone.
    patterns:
      flip_confirmation:
        trigger: >
          A 1H candle closes above a prior 1H resistance that has flipped into
          support (for longs), or closes below a prior 1H support that has
          flipped into resistance (for shorts), inside the 4H entry zone.
        entry: on the close of the flip candle.
        sl: beyond the last 1H swing that formed before the flip.
      zc2_sweep_reversal:
        trigger: >
          1H sweeps the "second zone of confluence" (ZC2) — a deeper
          liquidity pool below/above the first confluence zone — and reverses
          with a strong wick back into the 4H entry zone.
        entry: on the reversal candle close.
        sl: 1–2 ticks beyond the sweep wick.
      micro_pfq_on_institutional:
        trigger: >
          A 1H PFQ (stop hunt) at an institutional level (00/20/50/80) that
          aligns with the 4H entry zone, followed by a break of the micro
          structure in the direction of bias.
        entry: on the break of the micro structure.
        sl: on the far side of the PFQ sweep.
    discipline:
      - >
        If no 1H trigger prints within the 4H entry zone while the zone is
        still valid, pass the trade. Do not force an entry because "it
        should have happened".
      - >
        Never enter on 1H momentum alone. The 1H trigger is confirmation of
        a pre-existing 4H setup, not a discovery of a new idea.

    re_entry_discipline:
      rule: >
        One active entry per 4H confluence zone touch. After a setup in
        direction D has been entered (whether the 1H entry hit TP or SL),
        no new entry in direction D is allowed until BOTH of the following
        have happened:
          (a) price has traded back to a counter-direction confluence zone
              (i.e., a meaningful retracement against D that reaches at
              least the 50% alert level of the move that produced the
              original entry), AND
          (b) a new 4H structural element has formed at a NEW confluence
              zone — not the same zone the original entry came from.
        Until both conditions are met, treat the original setup as still
        active or as recently invalidated; the next bar in direction D
        is pyramiding on top of the same idea, not a new idea.
      rationale: >
        2019-recovery backtest produced three consecutive weekly long
        entries on BTC (2019-04-01, 04-08, 04-15) and on ETH (same dates),
        in the same direction, from progressively higher prices in the
        same impulse leg. The first entry was correct; the second and
        third were stopped when the inevitable pullback came, turning a
        winning setup into a net loss. Same pattern repeated in 2019-05
        (longs at $7907 and $8777) and 2019-09/10 (shorts at $8009 and
        $7818). The system was generating one entry per week regardless
        of whether an active setup already existed, amplifying losses on
        every chop.
      how_to_apply:
        - >
          Maintain a per-direction "last entry zone" reference. While an
          entry from that zone is open or its premise has not yet been
          invalidated by a counter-zone touch, reject all further entries
          in the same direction.
        - >
          A losing entry does NOT immediately re-arm the direction.
          A stopped-out long is still a long idea — wait for the
          counter-zone touch and a new structural element before the
          next long.
        - >
          A winning entry that has hit TP is also not an immediate
          re-arm. The fact that TP was reached confirms the impulse —
          the next entry must come from a fresh pullback, not a
          continuation chase.
        - >
          This rule applies independently per coin. BTC pyramiding does
          not block ETH entries.
      relationship_to_existing_rules:
        - >
          This is a STRICTER version of pro_trader_mindset's "wait for
          the exact setup" — it makes the wait condition explicit and
          testable so an engine can implement it.
        - >
          It does NOT replace position sizing in risk_management — it
          replaces the implicit assumption that "one signal per week is
          one trade per week".
      note_for_engines: >
        A backtest engine reading this section must track per-coin and
        per-direction state across the iteration loop. The default
        weekly walk in scripts/theory_backtest.py currently treats every
        week independently — that is the bug. State must persist:
        last_entry_zone[coin][direction], last_entry_outcome, and a
        flag for "counter-zone touched since last entry". Until that
        flag flips True AND a new zone is reached, no further entry
        in the same direction.

  stop_loss_placement_rules:
    description: >
      Stop-loss is not a "get me out" mechanism — it is the price at which
      the premise is proven wrong. If the SL is hit, it means the analysis
      was incorrect and you should be looking the other way.
    by_timeframe:
      weekly_bias_sl:
        placement: >
          Weekly SL is conceptual — it is the macro invalidation, not an
          order-level stop. Example: "if rates flip hawkish, weekly long bias
          is dead".
      daily_sl:
        placement: >
          At the opposite side of the daily swing that created the trend
          confirmation, beyond the nearest obvious liquidity pool.
      four_hour_sl:
        placement: >
          At the far edge of the 4H confluence zone (the "outside" of the
          BEN / block). This is the invalidation of the setup itself —
          if price closes beyond it, the 4H setup no longer exists.
      one_hour_sl:
        placement: >
          Beyond the last 1H swing that formed before the entry trigger,
          plus a small buffer for broker spread. Never inside the swing.
    anti_patterns:
      - Do not place SL at round numbers or obvious equal highs/lows — these are liquidity magnets.
      - Do not place SL right at the confluence zone edge — allow for spread-driven overshoot (~10–35 pips equivalent).
      - Do not place SL based on a fixed percentage of account; base it on invalidation and then size the position to match your risk.
      - Do not move SL to break-even reflexively; move it only when the next structural level confirms in your favor.

  retracement_entry_zones:
    description: >
      Replacement for the single-value "75% retracement" idea. The retracement
      zone is a band, not a point, and the exact target depends on the broker
      spread, the institutional-money withdrawal percentage, and the IPDA
      phase.
    zones:
      alert_50:
        meaning: 50% of the impulse — only an alert, never an entry.
        use: Start watching for a confluence setup; do NOT open a position here.
      minimum_75:
        meaning: 75% of the impulse — minimum acceptable entry zone.
        use: First acceptable entry level for setups that also satisfy the 4H/1H rules above.
      optimal_86:
        meaning: >
          86% of the impulse — corresponds to the BIS-estimated 86%
          institutional share of interbank flow. The idea: once the
          institutional 86% has withdrawn, the remaining 14% retail flow
          is insufficient to hold price, so we expect continuation if we
          enter here.
        use: Preferred entry zone for high-conviction 4H setups.
      deep_90:
        meaning: 90%+ — extreme retracement near origin.
        use: Acceptable only when broker spread is high (wide stops) or the HTF bias is extremely strong.
    important:
      - >
        Broker spread adds 10–35 pips of overshoot beyond the theoretical
        retracement level. Always set the SL *beyond* the spread-adjusted
        zone, not at the zone edge.
      - >
        50% is explicitly NOT an entry. Many retail patterns teach this and
        it is a trap — it is only a heads-up that the retracement has started.

    impulse_leg_identification:
      description: >
        The retracement percentages above are meaningless without an explicit
        definition of the impulse leg they are measured against. Without
        leg identification, an engine can re-anchor the leg every week and
        always find a "fresh 75% retracement" — which is exactly the
        chase-entry pathology.
      rule: >
        The CURRENT IMPULSE LEG is the leg between the most recent
        confirmed daily swing low and daily swing high (or vice versa
        for shorts) that bracket the most recent break of structure on
        the daily timeframe. A swing point is "confirmed" only after at
        least three daily candles have closed without violating it.
      lock_until_invalidated: >
        Once the current impulse leg is identified, it remains the
        anchor for retracement measurement until EITHER (a) a new daily
        BOS in the direction of bias prints a higher high (for longs)
        or lower low (for shorts), at which point the leg extends, OR
        (b) a daily BOS against the bias prints, at which point the leg
        is invalidated and a new one must be identified before any
        further entry.
      do_not_re_anchor_per_week: >
        Re-anchoring the impulse leg every week is the engine bug that
        produces "fresh 75% retracement" signals at every cycle high.
        The leg lifetime is measured in months for trends and weeks
        for ranges, not in single weekly walks.

    chase_prevention_rule:
      rule: >
        A fresh entry is allowed ONLY when current price is inside the
        75-86-90 retracement zone of the CURRENT IMPULSE LEG (as defined
        above). If current price is in the 0-50 retracement zone of the
        impulse leg in the direction of bias — i.e., still extended near
        the impulse high (for longs) or low (for shorts) — NO fresh
        entry is allowed regardless of any other signal.
      rationale: >
        The 2020-recovery+2021-ATH backtest is the textbook case. BTC
        produced fifteen losing entries in this period, of which nine
        were chase longs at progressively higher prices ($15549 in
        2020-11, $19318 in 2020-12, $23679 by year-end, $32843 in 2021-01,
        $59404 in 2021-03, $57407 in 2021-05, $47546 / $49418 / $51741
        in 2021-08-09, $61813 / $64999 in 2021-10-11). Each of those
        entries was at less than 30% retracement of the prior impulse
        leg — i.e., price was still extended near the recent high. ETH
        repeated the pattern with $456 / $552 / $1456 / $1742 / $3909 /
        $3311 / $4131 / $4688 / $4674 longs.
      how_to_apply:
        - >
          Compute the current impulse leg per coin per direction
          (separately for longs and shorts) and persist it across the
          weekly walk.
        - >
          On every weekly bias check, before evaluating the 4H setup,
          test the chase-prevention rule. If price is in the 0-50 zone
          of the impulse leg in the direction of bias, return "no
          entry — extended" and continue.
        - >
          If price is in the 50-75 zone, return "wait — retracement in
          progress, watch for confluence" but still no entry.
        - >
          Only when price reaches 75% or deeper does the existing 4H
          setup / 1H trigger pipeline activate.
      relationship_to_existing_rules:
        - >
          Tighter version of market_phase_discipline.rules's "never enter
          during momentum" — gives "during momentum" a measurable,
          impulse-leg-anchored definition.
        - >
          Compatible with re_entry_discipline (iter 3) and
          post_climax_cooldown (iter 4). Climax cooldown still dominates
          when both fire; chase prevention is the slower-grind cousin
          for trends that don't trigger a single-candle climax flag.
        - >
          Anchored on the existing 75/86/90 zones — does not introduce
          new percentages, only specifies which leg the percentages are
          measured against.
      note_for_engines: >
        The current scripts/theory_backtest.py weekly walk has no
        impulse-leg state. Implementation requires per-coin per-direction
        impulse_leg = (origin_swing_price, origin_swing_date,
        terminal_swing_price, terminal_swing_date), updated only on
        confirmed daily BOS events, NEVER per week. The chase-prevention
        check then computes (current_price - origin) / (terminal - origin)
        and rejects entries below 0.75 in the direction of bias. Lands
        in the Phase 2-final trading/ refactor.

  confluence_zones:
    description: >
      A confluence zone is a PRICE RANGE (not a line) where multiple factors
      align to create a high-probability rejection. Confluence zones are the
      only places we take entries. The more factors stacked, the higher the
      quality of the zone.
    required_factors_at_least_three:
      - Institutional level (00, 20, 50, 80).
      - True swing high or swing low (explicit, not implicit).
      - Block (order / rejection / mitigation / suspension).
      - Daily / weekly / monthly open or close.
      - Fair value gap inside the zone.
      - Prior touches (2+ touches = critical).
      - Vertical time line (session open, NY close, London open, Asia open).
    zc1_vs_zc2:
      zc1:
        name: Primera zona de confluencia (First confluence zone / ZC1).
        role: >
          First target and first profit-taking level. Typically the
          nearest opposing structure after the setup zone.
        action_on_touch: Take 80% of position profit on first touch.
      zc2:
        name: Segunda zona de confluencia (Second confluence zone / ZC2).
        role: >
          Deeper liquidity pool beyond ZC1. Used as extended target when
          ZC1 breaks cleanly, or as a sweep-and-reverse entry area.
        action_on_touch: Take additional 10% on touch; trail remaining 10%.

  ben_block_between_levels:
    description: >
      BEN (Bloque Entre Niveles, Block Between Levels) is the price range
      between a true swing point and the nearest institutional level
      (00/20/50/80). It is the primary construction used to turn fuzzy S/R
      into a usable entry zone.
    construction_steps:
      - Identify the true swing (not the implicit one — wait for the wick).
      - Find the nearest institutional level on the opposite side of the swing.
      - The price range between those two is the BEN.
      - Score the BEN by counting how many confluence factors fall inside it.
    usage_in_setup:
      - The 4H entry zone is usually a BEN with at least three confluence factors.
      - The SL sits on the far side of the BEN (outside the institutional level).
      - The entry sits inside the BEN, typically at the 75–86% retracement point.

  candle_shape_to_phase:
    description: >
      Candle body and wick structure is the fastest read on what phase of the
      market we are in. Use this as a visual first-pass before drawing anything.
    mappings:
      small_body_long_wick:
        phase: Volatility / regression / consolidation.
        meaning: Liquidity hunt, indecision, equilibrium.
        action: Do not chase — wait for the next momentum candle.
      large_body_short_wick:
        phase: Momentum / expansion.
        meaning: Clear directionality, cash flow engaged.
        action: Trade in the direction of the body only if post-volatility pre-momentum.
      equal_body_equal_wick:
        phase: Transition.
        meaning: Market searching for a new model.
        action: Stand down until one side dominates.

  spread_range_as_market:
    description: >
      The bid/ask spread IS the market. The market maker runs their P/L from
      the spread, and the spread defines the zone where the market maker
      WANTS price to stay. Movement outside the spread range is where we,
      the takers, make money.
    implications:
      - Before entering, check whether price has left the market-maker comfort zone (the spread range) in the direction of bias.
      - Entries inside the spread range are arbitrage territory — leave that to the makers.
      - Post-news moves that explode through the spread range are signals that the market maker model has broken and a new one is forming (rprice event).
      - When the spread widens on a venue, liquidity is fleeing — do not enter until it normalizes.

  interbank_reality:
    description: >
      Clarification of what "interbank price delivery algorithm" actually means,
      based on the transcripts. This is a correction of the common misconception
      that there is a single IPDA algorithm connecting all banks.
    there_is_no_single_algorithm:
      - Each bank, dealer, and market maker runs their own trading software.
      - Aggregators (Fortex, eSpeed, NEX, etc.) gather quotes from many venues and publish a composite.
      - IPDA / ebitda is an EXPLANATORY model for how correlated behavior emerges — not a literal unified algorithm.
      - Correlation between venues comes from shared incentives (liquidate in USD, maintain balance sheets, respond to central bank flows), not central coordination.
    why_this_matters:
      - Do not assume "the banks know where price is going". They don't — they react.
      - Do not assume a crossing of some level triggers a coordinated response. Each algorithm decides locally.
      - The 86% institutional share is the aggregate result of many uncoordinated-but-correlated decisions.
    institutional_retail_ratio:
      source: Bank for International Settlements (BIS) interbank study.
      ratio: 86% institutional / 14% retail of interbank flow.
      caveat_for_crypto: >
        The 86/14 figure is derived from forex markets. Crypto markets,
        particularly below BTC and ETH, are significantly more retail-dominated.
        Use this ratio as a prior for BTC/ETH setups only, and verify
        empirically in backtests.

  pro_trader_mindset:
    description: >
      The institutional / pro trader operates under a fundamentally different
      set of incentives than the retail trader. Internalizing these is part of
      the theory, not optional.
    traits:
      - Fixed percentage return target (typically 15–25% annual), not "beat the market".
      - Client-focused: the trader is paid by clients, not by the market; this constrains risk-taking.
      - 80% fundamental, 20% technical — charting is the execution layer, not the decision layer.
      - Time decay (theta) awareness: the longer you are in the market, the more exposure you have. Minimize screen time.
      - Certifications (FINRA Series 57) and institutional risk management require a formal process, not intuition.
      - Diversification across instruments and markets (hedging spot with futures, carry trades, etc.).
    common_retail_mistakes_to_unlearn:
      - "I need to beat the market."
      - "The market is manipulated against me."
      - "There's one indicator / one setup that always works."
      - "The chart IS the market."
      - "If I don't close, I don't lose."

  market_phase_discipline:
    description: >
      We are post-volatility, pre-momentum traders. The entire framework is
      built around identifying the transition between volatility and momentum
      and positioning just before momentum begins.
    rules:
      - Never enter during momentum — you are buying the top of the impulse.
      - Wait for post-momentum volatility (the pullback / consolidation after a move).
      - Position in the pullback, take profit into the next momentum phase.
      - If you miss the setup, skip the trade. The next pullback will come.
    why:
      - Volatility is accumulative (liquidity gathers).
      - Momentum is distributive (liquidity releases).
      - Entering during momentum means you are providing exit liquidity to someone else.

    post_climax_cooldown:
      rule: >
        After a CLIMAX EVENT — defined as a single daily candle whose true
        range exceeds 3× the trailing 20-day ATR, OR a weekly true range
        that exceeds 2× the trailing 20-week ATR — all entries in the
        direction of the climax (i.e., continuation entries) are SUSPENDED
        until a new structural reset has occurred. The reset is one of:
          (a) a higher-low (or lower-high) on the daily timeframe formed
              after the climax candle, AND a daily close back inside the
              pre-climax 20-day range, OR
          (b) at least 10 trading days have elapsed since the climax candle
              AND the daily candle structure is back to "normal" (no
              candle in the last 10 days exceeds 2× ATR), OR
          (c) the weekly bias has been re-confirmed by a NEW weekly close
              against the climax direction.
        Counter-climax entries (i.e., entering AGAINST the climax in
        anticipation of mean-reversion) are also suspended until (a), (b),
        or (c) holds — picking the bottom of a crash or the top of a
        squeeze is not the nave model.
      rationale: >
        The 2020-covid-crash backtest is the textbook example. After the
        BTC March 12-13 climax (single daily candle low ~$3850 from a
        $7900 prior close, range > 4× the 20-day ATR), the system kept
        printing short entries on 2020-03-16 ($5254) and 2020-03-23
        ($5903) — both stopped out as price reverted into the pre-climax
        range within days. ETH followed the identical pattern: shorts on
        03-16 and 03-23 stopped out. The weekly/daily MA-based bias was
        still pointing down because MAs are lagging — but the regime had
        already inverted on the climax candle itself.
      how_to_apply:
        - >
          Compute a rolling 20-day ATR and a 20-week ATR per coin
          alongside the existing macro and COT inputs.
        - >
          Flag any daily candle whose true range exceeds 3× the trailing
          20-day ATR as a daily climax. Flag any weekly candle whose true
          range exceeds 2× the trailing 20-week ATR as a weekly climax.
        - >
          On flag, freeze the directional re-arm: continuation entries in
          the climax direction are blocked AND counter-climax entries are
          also blocked. Both classes of entry are out of the model.
        - >
          The freeze ends only when one of the three reset conditions
          (a), (b), or (c) is met. Document the reset event in the trade
          log with the date and the condition that triggered it.
        - >
          During the freeze, the system may still observe and mark up
          structure — it just may not enter. This is the "francotirador
          patience" rule made testable.
      relationship_to_existing_rules:
        - >
          Strictly tighter than the generic "never enter during momentum"
          rule above. The momentum rule is qualitative; this one is a
          measurable, dated suspension with explicit reset criteria.
        - >
          Compatible with re_entry_discipline (iter 3): a climax event
          freezes BOTH directions even if re_entry_discipline would
          otherwise allow a fresh trade in the opposite direction.
          The climax rule is the more conservative of the two and
          dominates when both apply.
        - >
          Aligned with volatility_deep_dive's "ATR-based filter" note,
          which previously only existed as a one-line orientation hint.
          This block makes the filter into an actual rule.
      note_for_engines: >
        The current scripts/theory_backtest.py weekly walk has no concept
        of climax detection. Implementation requires a per-coin running
        ATR and a freeze flag whose state survives the weekly walk. The
        freeze flag must dominate both the weekly bias call and the 4H
        setup check — i.e., even if all other conditions pass, the freeze
        forces a "no entry" outcome. Like re_entry_discipline, this lands
        in the Phase 2-final trading/ refactor.

  semantics_note:
    description: >
      The transcripts make a strict semantic distinction: "the market does not
      go up or down — the PRICE does". The market is a marketplace with a bid
      and ask; price is what moves between them. For practical purposes in this
      codebase, "price" and "market direction" are treated as equivalent, but
      any documentation should use "price" when referring to movement.
    practical_impact:
      - Diagonal trendlines are downgraded to "visual context" — they are not standalone signals because price moves vertically, and the diagonal is an artifact of the time axis.
      - Horizontal levels (institutional, opens/closes, swings) are the primary structure.
      - Trendlines may still be drawn but must never be the sole reason for an entry.
