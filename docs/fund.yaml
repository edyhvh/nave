  - customization: '"Yield Stress Alert" → >4.5% = QE probable; <3.90% = yields cayendo fuerte. Detectar triángulo lateral.'
    description: Nivel absoluto de la rentabilidad del bono USA 10 años. Cava lo usa como trigger de intervención Fed cuando sube demasiado (inflación/deuda) o como en el último vídeo (triángulo lateral desde oct-2023, soporte ~3.95%).
    frequency: Daily
    name: US 10-Year Treasury Yield (Absolute Level)
    relevance: Mide tensión en el mercado de bonos y probabilidad de QE disfrazado. Muy usado por José Luis Cava 2024-2025.
    source_api: FRED (DGS10) vía OpenBB
    status: Ready
    external_available: No
    openbb_available: Yes
    notes: 100% funcional con obb.fixedincome.rate(symbol="DGS10"). Histórico desde 1962. Fácil detección de rangos/triángulos con pandas.
