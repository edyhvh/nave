    frequency: Daily.
    name: Crypto Market Capitalization and ETF Flows
    relevance: Predicts BTC rises (e.g., 375k).
    source_api: Coingecko for cap/flows.
    status: Pending
    external_available: No
    openbb_available: Yes
    notes: Available via obb.crypto module. Market cap and ETF flows data accessible through crypto endpoints. OpenBB integrates with Blockworks API for ETF flows.
  - customization: Emerging markets adoption index.
    description: Global flows (e.g., emergents to stablecoins) steal savings; PDF (p.19) for short-term currencies.
