# Coverage Summary:
# openbb_available:
# - Yes: Fully available via OpenBB
# - Partial: Some data available, may require external integration for complete coverage
# - No: Not available in OpenBB, requires external API integration
# external_available:
# - Yes: External implementation available (APIs, scraping, etc.)
# - Partial: Some external sources available
# - No: No known external implementations
#
# Total indicators: 22
# OpenBB Available (Yes): 18
# OpenBB Partially available (Partial): 2
# OpenBB Not available (No): 2
# External Available (Yes): 3
# External Partially available (Partial): 4
# External Not available (No): 13

categories:
- indicators:
  - customization: '"Liquidity Pulse" (TGA + RRP + crypto ETF flows).'
    description: Treasury balance in Fed and liquidity injections; reductions inject slack into the system (e.g., 300k million for Q1 2026 drive BTC/gold).
    frequency: Daily.
    name: TGA (Treasury General Account) and RRP (Reverse Repo Facility)
    relevance: Key in videos for predicting rises due to "ample liquidity".
    source_api: FRED (Fed Reserve Economic Data).
    status: Pending
    external_available: No
    openbb_available: Yes
    notes: Available via obb.economy.fred_series() for TGA/RRP data. Crypto ETF flows available via obb.crypto module.
  - customization: Alert if stimulus > GDP threshold (e.g., 20T historical).
    description: 'Stimuli like $2000 from Trump increase deficit and rises in hard assets; fiscal indiscipline (videos #2, #10-12).'
    frequency: Weekly (track bills).
    name: Fed Injections and Fiscal Stimuli (e.g., Government Checks)
    relevance: Fiscal indiscipline guarantees rises.
    source_api: FRED for QE/RRP; news via web_search for fiscal bills.
    status: Pending
    external_available: Partial
    openbb_available: Yes
    notes: Available via obb.economy.fred_series() for TGA/RRP data. QE data available via obb.economy.fred_series(). Fiscal bills/news tracking requires external web_search integration.
  - customization: Global comparison (USA vs. Japan/EU).
    description: No aggressive rate cuts favor hedging in BTC; PDF mentions as variable for center/periphery currencies.
    frequency: Monthly (Fed meetings).
    name: Monetary Policy (Interest Rates and Aggressive Cuts)
    relevance: Affects hedging in crypto.
    source_api: FRED for Fed Funds Rate; ECB/BOJ APIs.
    status: Pending
    external_available: No
    openbb_available: Yes
    notes: Fed Funds Rate available via obb.economy.fred_series(). ECB/BOJ rates may be available through obb.economy module with multiple data providers (FRED, OECD, IMF).
  name: Liquidity and Monetary Policy
- indicators:
  - customization: 'Integrate with Fear & Greed Index for crypto-specific.'
    description: 'Contrarian theory; spike in bulls indicates continuation (videos #1-2, #4-6).'
    frequency: Weekly.
    name: 'AAII Survey (Bullish Spread: Bulls vs. Bears)'
    relevance: Signals trend continuation.
    source_api: AAII public or Alpha Vantage.
    status: Pending
    external_available: Yes
    openbb_available: No
    notes: ✅ VERIFIED - Functional implementation available. Script `scripts/check_aaii.py` proves AAII website scraping works correctly, extracting Bullish/Bearish percentages and calculating spread. No API keys required - uses direct web scraping. Ready for FastAPI integration as psychological filter.
  - customization: Gauge 0-100 based on VIX + ETF flows.
    description: Risk appetite/aversion; PDF (p.19) lists as variable for currencies/crypto; videos link to global flows.
    frequency: Daily.
    name: Risk Appetite (Risk-On/Off)
    relevance: Determines flows to crypto.
    source_api: VIX (volatility) via Yahoo Finance; capital flows via IMF.
    status: Pending
    external_available: Partial
    openbb_available: Yes
    notes: VIX data available via obb.equity.price(symbol='^VIX') or obb.equity modules. ETF flows available via obb.crypto module. IMF capital flows may be available through obb.economy.balance_of_payments() or require external integration.
  name: Sentiment and Market Psychology
- indicators:
  - customization: '"Fiat Bubble Index" (debt/GDP vs. BTC/gold cap).'
    description: 'High ratios (e.g., Japan 252%) justify aggressive spending, weakening fiat (videos #3, #7-9); PDF mentions PPP/NIIP for long term.'
    frequency: Quarterly.
    name: Debt/GDP Ratio (Total vs. Net)
    relevance: Fiat weakening favors BTC/gold.
    source_api: World Bank or FRED.
    status: Pending
    external_available: No
    openbb_available: Yes
    notes: Available via obb.economy.fred_series() for US data. World Bank data may be available through obb.economy module with multiple providers (OECD, IMF, EconDB).
  - customization: Percentage coverage of tariffs vs. deficit (e.g., current ~$259B tariff revenue vs. monthly deficits).
    description: 'US monthly deficit not covered by tariff revenue; low coverage percentage (<10% historically) favors fiscal indiscipline driving hard assets like BTC/gold (videos #2, #10).'
    frequency: Monthly.
    name: Public Deficit and Tariff Revenue
    relevance: Measures fiscal discipline vs. revenue generation from tariffs.
    source_api: FRED for deficit data; US Treasury FiscalData API for tariff revenue.
    status: Verified
    external_available: Yes
    openbb_available: Partial
    notes: "✅ VERIFIED - Functional implementation available. Script `scripts/test_tariff_api.py` proves US Treasury FiscalData API connectivity and data retrieval. Deficit data available via obb.economy.fred_series(). Tariff revenue via direct US Treasury FiscalData API integration. Currently implementing 'openbb-treasury' extension to bridge this gap. Goal: Contribute to OpenBB upstream, or use as private extension if not merged."
  - customization: Historical chart 1700-current; "Fiat Decay Rate".
    description: 'Post-1971 plunge shows "fiat trash" (videos #1, #3); PDF uses PPP for currency value.'
    frequency: Weekly.
    name: Fiat Purchasing Power (e.g., Dollar/Yen vs. Gold/BTC)
    relevance: Shows fiat bubble.
    source_api: FRED for inflation/PPP; Coingecko for vs. BTC.
    status: Pending
    external_available: No
    openbb_available: Yes
    notes: Fully available via obb.economy.cpi() and obb.economy.pce() for inflation data, obb.economy.fred_series() for historical inflation, obb.commodity.price(symbol='GC') for gold prices, obb.crypto.price(symbol='BTC') for Bitcoin prices, and obb.currency.* for exchange rates. Historical data (1700+) may be limited in FRED but sufficient for analysis.
  name: Debt, Deficit, and Fiat Currency Value
- indicators:
  - customization: BTC prediction (e.g., 375k if x3 cap).
