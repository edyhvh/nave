    source_api: Chainalysis or IMF for flows; Coingecko for stablecoins.
    status: Pending
    external_available: Partial
    openbb_available: Yes
    notes: Stablecoin data available via obb.crypto.price() and obb.crypto modules. IMF capital flows available through obb.economy.balance_of_payments() and obb.economy.direction_of_trade(). Chainalysis detailed data requires external integration.
  - customization: Comparison USA/EU/China (power axes, PDF p.3).
    description: Besen/Trump predictions; PDF lists as center/periphery variable.
    frequency: Quarterly.
    name: Economic Growth (2025-2026 Recovery)
    relevance: Drives markets.
    source_api: FRED for GDP; IMF forecasts.
    status: Pending
    external_available: No
    openbb_available: Yes
    notes: GDP data available via obb.economy.fred_series() for US. IMF forecasts available through obb.economy module with multiple providers (FRED, OECD, IMF, EconDB).
  - customization: '"Currency Health Score" vs. BTC.'
    description: For long-term currency value (PDF p.19); aligns with fiat weakening in videos.
    frequency: Annual/quarterly.
    name: PPP (Purchasing Power Parity) and NIIP (Net International Investment Position)
    relevance: Long-term currency value vs. crypto.
    source_api: World Bank for PPP; BEA for NIIP USA.
    status: Pending
    external_available: No
    openbb_available: Yes
    notes: PPP data available via obb.economy.fred_search(query='PPP') and multiple providers (OECD/IMF). NIIP data available via obb.economy.fred_series(series_id='IIPUSNETIQ') and obb.economy.indicators(). World Bank/BEA detailed data may be available through additional providers.
  name: Crypto-Specific and Global Flows
- indicators:
  - customization: '"Inflation Hedge Score" (CPI vs. BTC returns).'
    description: Measures general and core inflation; rising inflation accelerates hedging in BTC as "digital gold" against fiat devaluation (complements Cava's "fiat decay").
    frequency: Monthly.
    name: Inflation Rates (CPI/PCE - Consumer Price Index / Personal Consumption Expenditures)
    relevance: In 2025, hawkish Fed shifts could cause crypto volatility.
    source_api: FRED (CPI) or BEA (PCE).
    status: Pending
    external_available: No
    openbb_available: Yes
    notes: CPI and PCE data available via obb.economy.fred_series(). Both indicators are standard FRED series accessible through OpenBB.
  - customization: Alert if >4.5% (recession signal).
    description: Indicators of economic health; high unemployment signals recession, boosting risk aversion and flows to safe-havens like BTC/gold (extends Cava's "risk-on/off").
    frequency: Monthly (NFP first Friday).
    name: Unemployment Rate and Non-Farm Payrolls
    relevance: Crucial for anticipating fiscal stimuli.
    source_api: FRED or BLS (Bureau of Labor Statistics).
    status: Pending
    external_available: No
    openbb_available: Yes
    notes: Unemployment rate and NFP data available via obb.economy.fred_series(). Both are standard FRED series (UNRATE, PAYEMS) accessible through OpenBB.
  - customization: '"MSTR Wall Alert" -> <188-192$ = Bitcoin capped / >192$ = door open / Detect gamma wall biggest in options.'
    description: MicroStrategy (MSTR) price and options. Jose Luis Cava uses it since 2024-2025 as the main leading indicator of institutional Bitcoin. Wall Street buys BTC spot and sells MSTR calls/futures. While MSTR doesn't cleanly exceed 188-192$, bearish pressure on Bitcoin continues.
    frequency: Daily
    name: MicroStrategy (MSTR) – Bitcoin Institutional Proxy
    relevance: In 2025 it's more sensitive than Bitcoin's own price to dealers and Wall Street action.
    source_api: Yahoo Finance + Polygon via OpenBB
    status: Ready
    external_available: No
    openbb_available: Yes
    notes: 100% functional with obb.equity.price.historical(symbol="MSTR") and obb.derivatives.options.chains(symbol="MSTR")
  name: Inflation and Employment
- indicators:
